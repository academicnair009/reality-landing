<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RIALITI Capture on Google Play</title>
<meta http-equiv="refresh" content="2; url=https://play.google.com/store/apps/details?id=app.rialiti.capture&amp;referrer=utm_source%3Drialiti.io%26utm_medium%3Dredirect%26utm_campaign%3Dgo-android%26utm_content%3Dnojs">
<style>
  html { background: #0C0D11; color: #F4F1EC; font: 300 17px/1.6 Lexend, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  main { max-width: 28rem; text-align: center; }
  h1 { font-weight: 600; font-size: 1.35rem; margin: 0 0 .6rem; }
  p { margin: 0 0 1.2rem; color: #AFAAA2; }
  a { color: #F4F1EC; }
</style>
</head>
<body>
<main>
  <h1>Taking you to Google Play</h1>
  <p>RIALITI Capture is free on Android. If nothing happens, use the link below.</p>
  <p><a id="store" href="https://play.google.com/store/apps/details?id=app.rialiti.capture&amp;referrer=utm_source%3Drialiti.io%26utm_medium%3Dredirect%26utm_campaign%3Dgo-android%26utm_content%3Dmanual">Open RIALITI Capture on Google Play</a></p>
</main>
<script>
  /* Redirect to the Play listing, carrying an install referrer so Play Console
     can attribute installs per campaign cell. ?c=<cell> is allow-listed; any
     other value becomes "other". No cookies, no storage, nothing logged here. */
  (function () {
    var allowed = /^[a-z0-9-]{1,32}$/;
    var c = new URLSearchParams(location.search).get("c") || "";
    if (!allowed.test(c)) c = "other";
    var ref = "utm_source=meta&utm_medium=paid&utm_campaign=marketplace-oct26&utm_content=" + c;
    var url = "https://play.google.com/store/apps/details?id=app.rialiti.capture&referrer=" + encodeURIComponent(ref);
    document.getElementById("store").href = url;
    location.replace(url);
  })();
</script>
</body>
</html>
